<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="description" content="Track your daily routines with ease" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Daily Routine" />
  <title>Daily Routine Checklist</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ===== ICONS (Inline SVG) =====
    const CheckCircleIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );
    const CircleIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <circle cx="12" cy="12" r="9" />
      </svg>
    );
    const PlusIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
      </svg>
    );
    const TrashIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    );
    const EditIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
      </svg>
    );
    const MoonIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
    );
    const SunIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
      </svg>
    );

    // ===== MAIN APP =====
    function App() {
      const [darkMode, setDarkMode] = useState(false);
      const [routines, setRoutines] = useState({ morning: [], afternoon: [], evening: [] });
      const [newTask, setNewTask] = useState({ category: 'morning', text: '' });
      const [editingTask, setEditingTask] = useState(null);
      const [streak, setStreak] = useState(0);

      useEffect(() => {
        const saved = localStorage.getItem('routines');
        const savedStreak = localStorage.getItem('streak');
        const savedTheme = localStorage.getItem('darkMode');
        const lastReset = localStorage.getItem('lastReset');
        const today = new Date().toDateString();

        if (savedTheme) setDarkMode(JSON.parse(savedTheme));
        if (savedStreak) setStreak(parseInt(savedStreak));

        if (saved) {
          const parsed = JSON.parse(saved);
          if (lastReset !== today) {
            const allDone = Object.values(parsed).every(cat => 
              cat.length > 0 && cat.every(t => t.completed)
            );
            if (allDone) {
              const newStreak = (parseInt(savedStreak) || 0) + 1;
              setStreak(newStreak);
              localStorage.setItem('streak', newStreak);
            } else if (lastReset) {
              setStreak(0);
              localStorage.setItem('streak', 0);
            }
            const reset = {};
            Object.keys(parsed).forEach(k => {
              reset[k] = parsed[k].map(t => ({ ...t, completed: false }));
            });
            setRoutines(reset);
            localStorage.setItem('lastReset', today);
          } else {
            setRoutines(parsed);
          }
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('routines', JSON.stringify(routines));
      }, [routines]);

      useEffect(() => {
        localStorage.setItem('darkMode', JSON.stringify(darkMode));
      }, [darkMode]);

      const addTask = () => {
        if (!newTask.text.trim()) return;
        setRoutines(prev => ({
          ...prev,
          [newTask.category]: [...prev[newTask.category], { id: Date.now(), text: newTask.text, completed: false }]
        }));
        setNewTask(prev => ({ ...prev, text: '' }));
      };

      const toggleTask = (cat, id) => {
        setRoutines(prev => ({
          ...prev,
          [cat]: prev[cat].map(t => t.id === id ? { ...t, completed: !t.completed } : t)
        }));
      };

      const deleteTask = (cat, id) => {
        setRoutines(prev => ({ ...prev, [cat]: prev[cat].filter(t => t.id !== id) }));
      };

      const saveEdit = () => {
        if (!editingTask || !editingTask.newText.trim()) return;
        setRoutines(prev => ({
          ...prev,
          [editingTask.category]: prev[editingTask.category].map(t =>
            t.id === editingTask.task.id ? { ...t, text: editingTask.newText } : t
          )
        }));
        setEditingTask(null);
      };

      const totalTasks = Object.values(routines).reduce((s, c) => s + c.length, 0);
      const doneTasks = Object.values(routines).reduce((s, c) => s + c.filter(t => t.completed).length, 0);
      const progress = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;

      const categories = {
        morning: { label: 'Pagi', emoji: '🌅', gradient: 'linear-gradient(135deg, #f97316, #ec4899)' },
        afternoon: { label: 'Siang', emoji: '☀️', gradient: 'linear-gradient(135deg, #facc15, #f97316)' },
        evening: { label: 'Malam', emoji: '🌙', gradient: 'linear-gradient(135deg, #6366f1, #9333ea)' }
      };

      const dm = darkMode;
      const bg = dm ? '#111827' : '#EEF2FF';
      const card = dm ? '#1F2937' : '#ffffff';
      const text = dm ? '#F3F4F6' : '#1F2937';
      const subtext = dm ? '#9CA3AF' : '#6B7280';
      const inputBg = dm ? '#374151' : '#F9FAFB';

      return (
        <div style={{ minHeight: '100vh', background: bg, color: text, transition: 'all 0.3s', padding: '16px', paddingBottom: '40px' }}>
          <div style={{ maxWidth: '600px', margin: '0 auto' }}>

            {/* Header Card */}
            <div style={{ background: card, borderRadius: '20px', padding: '24px', marginBottom: '16px', boxShadow: '0 4px 20px rgba(0,0,0,0.08)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                <h1 style={{ margin: 0, fontSize: '26px', fontWeight: '800' }}>Daily Routine ✨</h1>
                <button onClick={() => setDarkMode(!dm)} style={{ background: inputBg, border: 'none', borderRadius: '50%', padding: '8px', cursor: 'pointer', color: text, display: 'flex' }}>
                  {dm ? <SunIcon /> : <MoonIcon />}
                </button>
              </div>

              <div style={{ display: 'flex', gap: '12px', alignItems: 'center' }}>
                <div style={{ flex: 1 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px', fontSize: '13px', color: subtext }}>
                    <span>Progress Hari Ini</span>
                    <strong style={{ color: text }}>{progress}%</strong>
                  </div>
                  <div style={{ background: '#E5E7EB', borderRadius: '999px', height: '10px', overflow: 'hidden' }}>
                    <div style={{ width: `${progress}%`, height: '100%', background: 'linear-gradient(90deg, #34D399, #3B82F6)', transition: 'width 0.5s' }} />
                  </div>
                </div>
                <div style={{ background: dm ? '#374151' : '#FFF7ED', borderRadius: '14px', padding: '10px 16px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <span style={{ fontSize: '20px' }}>🔥</span>
                  <div>
                    <div style={{ fontSize: '11px', color: subtext }}>Streak</div>
                    <div style={{ fontSize: '22px', fontWeight: '800', color: '#F97316' }}>{streak}</div>
                  </div>
                </div>
              </div>
            </div>

            {/* Add Task */}
            <div style={{ background: card, borderRadius: '20px', padding: '14px', marginBottom: '16px', boxShadow: '0 4px 20px rgba(0,0,0,0.08)', display: 'flex', gap: '8px' }}>
              <select
                value={newTask.category}
                onChange={e => setNewTask({ ...newTask, category: e.target.value })}
                style={{ background: inputBg, color: text, border: 'none', borderRadius: '10px', padding: '10px', outline: 'none', cursor: 'pointer' }}
              >
                {Object.entries(categories).map(([k, v]) => (
                  <option key={k} value={k}>{v.emoji} {v.label}</option>
                ))}
              </select>
              <input
                type="text"
                value={newTask.text}
                onChange={e => setNewTask({ ...newTask, text: e.target.value })}
                onKeyPress={e => e.key === 'Enter' && addTask()}
                placeholder="Tambah rutinitas baru..."
                style={{ flex: 1, background: inputBg, color: text, border: 'none', borderRadius: '10px', padding: '10px 14px', outline: 'none', fontSize: '15px' }}
              />
              <button
                onClick={addTask}
                style={{ background: 'linear-gradient(135deg, #3B82F6, #6366F1)', color: 'white', border: 'none', borderRadius: '10px', padding: '10px 16px', cursor: 'pointer', display: 'flex', alignItems: 'center' }}
              >
                <PlusIcon />
              </button>
            </div>

            {/* Categories */}
            {Object.entries(categories).map(([cat, conf]) => (
              <div key={cat} style={{ background: card, borderRadius: '20px', padding: '16px', marginBottom: '14px', boxShadow: '0 4px 20px rgba(0,0,0,0.08)' }}>
                <div style={{ background: conf.gradient, borderRadius: '12px', padding: '10px 16px', marginBottom: '12px', display: 'flex', alignItems: 'center', gap: '8px', color: 'white' }}>
                  <span style={{ fontSize: '20px' }}>{conf.emoji}</span>
                  <span style={{ fontWeight: '700', fontSize: '16px' }}>{conf.label}</span>
                  <span style={{ marginLeft: 'auto', background: 'rgba(255,255,255,0.25)', borderRadius: '999px', padding: '2px 10px', fontSize: '13px' }}>
                    {routines[cat].filter(t => t.completed).length}/{routines[cat].length}
                  </span>
                </div>

                {routines[cat].length === 0 ? (
                  <p style={{ textAlign: 'center', color: subtext, fontSize: '14px', padding: '16px 0', margin: 0 }}>
                    Belum ada rutinitas. Tambahkan di atas! 👆
                  </p>
                ) : (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                    {routines[cat].map(task => (
                      <div key={task.id} style={{ display: 'flex', alignItems: 'center', gap: '10px', background: inputBg, borderRadius: '12px', padding: '12px', opacity: task.completed ? 0.6 : 1, transition: 'opacity 0.2s' }}>
                        <button onClick={() => toggleTask(cat, task.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: task.completed ? '#10B981' : '#9CA3AF', padding: 0, display: 'flex', flexShrink: 0 }}>
                          {task.completed ? <CheckCircleIcon /> : <CircleIcon />}
                        </button>

                        {editingTask?.task.id === task.id ? (
                          <input
                            autoFocus
                            value={editingTask.newText}
                            onChange={e => setEditingTask({ ...editingTask, newText: e.target.value })}
                            onKeyPress={e => e.key === 'Enter' && saveEdit()}
                            onBlur={saveEdit}
                            style={{ flex: 1, background: card, color: text, border: '1px solid #6366F1', borderRadius: '8px', padding: '4px 8px', outline: 'none' }}
                          />
                        ) : (
                          <span style={{ flex: 1, textDecoration: task.completed ? 'line-through' : 'none', fontSize: '15px' }}>
                            {task.text}
                          </span>
                        )}

                        <button onClick={() => setEditingTask({ category: cat, task, newText: task.text })} style={{ background: 'none', border: 'none', cursor: 'pointer', color: subtext, padding: '4px', display: 'flex' }}>
                          <EditIcon />
                        </button>
                        <button onClick={() => deleteTask(cat, task.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#EF4444', padding: '4px', display: 'flex' }}>
                          <TrashIcon />
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}

            {/* Footer */}
            <div style={{ background: card, borderRadius: '20px', padding: '16px', textAlign: 'center', color: subtext, fontSize: '13px', boxShadow: '0 4px 20px rgba(0,0,0,0.08)' }}>
              <p style={{ margin: '0 0 4px' }}>💡 Checklist reset otomatis setiap hari</p>
              <p style={{ margin: 0 }}>Selesaikan semua task untuk naikkan streak! 🔥</p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script>
    // Register Service Worker untuk offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(
          reg => console.log('SW registered:', reg.scope),
          err => console.log('SW failed:', err)
        );
      });
    }
  </script>
</body>
</html>
